    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#24503f" stroke-opacity="0.55" stroke-width="2"/>
