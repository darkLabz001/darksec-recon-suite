    <circle cx="128" cy="132" r="100"/>
  </g>

  <g fill="none" stroke="url(#serp)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 196 68 C 196 68, 60 62, 60 132 C 60 188, 142 200, 164 154 C 180 120, 138 104, 114 126 C 96 142, 108 168, 130 164"/>
  </g>

